[package]
name = "kandoair"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, Windows-only pie menu based on Kando."
publish = false

[[bin]]
name = "KandoAir"
path = "src/main.rs"

[dependencies]
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
