name: Bug Report
description: File a bug report for KandoAir (Windows).
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve KandoAir!
  - type: textarea
    id: summary
    attributes:
      label: Short Summary
      description: In one sentence, what is this issue about?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Steps to Reproduce the Issue
      description: Step by step, how can the problem be reproduced?
      value: |
        1. Open KandoAir or Settings via the tray icon
        2. Click on ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KandoAir Version
      description: What version of KandoAir are you running?
      placeholder: e.g. "v0.1.0" or "latest from kandoair branch"
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation Method
      description: How did you install KandoAir?
      multiple: false
      options:
        - Portable zip archive downloaded from GitHub Releases
        - Built from source (kandoair branch)
        - Another method (specify in the comments below)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Windows Edition
      description: On which Windows version have you observed the issue?
      multiple: false
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Other Windows version (specify below)
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: OS & WebView2 Version
      description: Which Windows build and WebView2 Runtime version are you running?
      placeholder: e.g. "Windows 11 24H2 (26100), WebView2 130+"
    validations:
      required: true
  - type: textarea
    id: comments
    attributes:
      label: Additional Information
      description: Use this to add any additional comments or logs which you think may be related.
  - type: markdown
    attributes:
      value: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/seiya058904/KandoAir/blob/kandoair/docs/code-of-conduct.md).
