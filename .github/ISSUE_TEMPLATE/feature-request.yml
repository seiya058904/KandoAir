name: Feature Request
description: Suggest a new feature for KandoAir.
labels: ['feature request']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve KandoAir!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you suggest?
      placeholder: I think that it would be cool if...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of KandoAir would benefit from this idea?
      multiple: true
      options:
        - Pie Menu & Marking Mode
        - Settings Window
        - Native Rust Host & Actions
        - Themes & Sound Effects
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: comments
    attributes:
      label: Additional Information
      description: Use this to add any additional comments which you think may be related.
  - type: markdown
    attributes:
      value: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/seiya058904/KandoAir/blob/kandoair/docs/code-of-conduct.md).
